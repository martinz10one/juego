<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego de Temperatura</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="game" class="container frio">
        <h1>🔥 Adivina el Número 🔥</h1>

        <div class="timer">
            ⏱ Tiempo: <span id="time">30</span>s
        </div>

        <input 
            type="number" 
            id="guessInput" 
            placeholder="Número (1-100)" 
            min="1" 
            max="100"
        >

        <button id="guessBtn">Probar</button>

        <p id="message">Haz tu primer intento...</p>

        <p class="history">
            Intentos previos: <span id="history">—</span>
        </p>
    </div>

    <script src="index.js"></script>
</body>
</html>
